<!-- Homepage template with placeholder variables for dynamic content -->
<nav>
    <div class="container nav-content">
        <div class="nav-left">
            <strong><a href="#about" class="nav-name">{{ name }}</a></strong>
        </div>
        <div class="nav-right">
            <a href="#about">About</a>
            <a href="#research">Research</a>
            <a href="#projects">Projects</a>
            <a href="#blog">Blog</a>
        </div>
    </div>
</nav>

<main class="container">
    <!-- About Section -->
    <section id="about">
        <div class="about-content">
            <div class="about-left">
                <img src="assets/images/profile.jpg" alt="{{ name }} profile photo" class="profile-image">
            </div>
            <div class="about-right">
                <div class="bio-text">{{ bio }}</div>
            </div>
        </div>
    </section>

    <!-- Research Section -->
    <section id="research">
        <h2>Selected Publications <a href="{{ scholar_url }}">(see all)</a></h2>
        <div class="publications">
            {{ publications }}
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>Open Source Projects</h2>
        <div class="projects">
            {{ projects }}
        </div>
    </section>

    <!-- Blog Section -->
    <section id="blog">
        <h2>Blog</h2>
        <div class="blog-posts">
            {{ recent_posts }}
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <div class="footer-content">
            <div class="footer-links">
                <a href="mailto:{{ email }}" class="footer-link" title="Email">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </a>
                <a href="{{ github }}" class="footer-link" title="GitHub" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
                <a href="{{ scholar_url }}" class="footer-link" title="Google Scholar" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M5.242 13.769L0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/>
                    </svg>

            </div>
            <p class="footer-text">Last updated: {{ updated_at }}</p>
        </div>
    </div>
</footer>
