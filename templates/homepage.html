<!-- Homepage template with placeholder variables for dynamic content -->
<nav>
    <div class="container nav-content">
        <div class="nav-left">
            <strong><a href="#about" class="nav-name">{{ name }}</a></strong>
        </div>
        <div class="nav-right">
            <a href="#about">About</a>
            <a href="#research">Research</a>
            <a href="#blog">Blog</a>
        </div>
    </div>
</nav>

<main class="container">
    <!-- About Section -->
    <section id="about">
        <div class="about-content">
            <div class="about-left">
                <img src="assets/images/profile.jpg" alt="{{ name }} profile photo" class="profile-image">
            </div>
            <div class="about-right">
                <div class="bio-text">{{ bio }}</div>
            </div>
        </div>
    </section>

    <!-- Research Section -->
    <section id="research">
        <h2>Selected Publications <a href="{{ scholar_url }}">(See all)</a></h2>
        <div class="publications">
            {{ publications }}
        </div>
    </section>

    <!-- Blog Section -->
    <section id="blog">
        <h2>Blog</h2>
        <div class="blog-posts">
            {{ recent_posts }}
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; {{ email }}. Last updated: {{ updated_at }}.</p>
    </div>
</footer>
