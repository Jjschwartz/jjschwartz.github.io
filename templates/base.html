<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        /* Custom color scheme */
        :root {
            --bg-color: #fefbf6; /* Warm white background */
            --text-color: #1a1a1a; /* Dark text color */
            --link-color: #2563eb; /* Blue for links */
            
            /* Override Pico.css variables */
            --background-color: var(--bg-color) !important;
            --color: var(--text-color) !important;
        }
        
        * {
            background-color: inherit !important;
        }
        
        html, body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
        }
        
        /* Force background on all major containers */
        html, body, main, .container, article {
            background-color: var(--bg-color) !important;
        }
        
        /* Ensure all headings use our text color */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color) !important;
        }
        
        /* Style links appropriately */
        a {
            color: var(--link-color) !important;
        }
        
        /* Navigation links should be dark */
        nav a {
            color: var(--text-color) !important;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--background-color);
            border-bottom: var(--border-width) solid var(--muted-border-color);
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .nav-left .nav-name {
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        .nav-right {
            display: flex;
            gap: 2rem;
        }
        
        .nav-right a {
            text-decoration: none;
            font-weight: 500;
        }
        
        main {
            margin-top: 80px;
        }
        
        .about-content {
            display: flex;
            align-items: center;
            gap: 3rem;
            margin-bottom: 2rem;
        }
        
        .about-left {
            flex-shrink: 0;
        }
        
        .profile-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .about-right {
            flex: 1;
        }
        
        .bio-text {
            text-align: left;
            line-height: 1.6;
        }
        
        .bio-text p {
            margin-bottom: 1rem;
        }
        
        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .about-content {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }
            
            .bio-text {
                text-align: center;
            }
        }
        
        .publication {
            margin-bottom: 1.5rem;
        }
        
        .publication-title {
            font-weight: bold;
        }
        
        .publication-venue {
            font-style: italic;
        }
        
        .blog-post-item {
            margin-bottom: 1rem;
        }
        
        .blog-post-date {
            color: var(--muted-color);
            font-size: 0.9em;
        }
        
        section {
            margin-bottom: 3rem;
            padding: 2rem 0;
            scroll-margin-top: 100px; /* Ensure section headers appear below nav */
        }
        
        footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem 0;
            border-top: var(--border-width) solid var(--muted-border-color);
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
