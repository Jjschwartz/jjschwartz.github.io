<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    
    <!-- MathJax for LaTeX math rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* Obsidian-inspired light theme */
        :root {
            --bg-color: #fafafa; /* Clean light background */
            --text-color: #2e3338; /* Slightly softer black */
            --heading-color: #1a202c; /* Dark gray/black for headings */
            --link-color: #6366f1; /* Indigo links */
            --muted-text: #64748b; /* Muted text color */
            --border-color: #e2e8f0; /* Light border */
            --code-bg: #f1f5f9; /* Light code background */
            --blockquote-bg: #f8fafc; /* Light blockquote background */
            --table-bg: rgba(248, 250, 252, 0.5); /* Subtle table background */
            
            /* Override Pico.css variables */
            --background-color: var(--bg-color) !important;
            --color: var(--text-color) !important;
            --spacing: 0.25rem;
        }
        
        /* Remove overly broad inheritance rule that was hiding text */
        
        html, body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            line-height: 1.65;
        }
        
        /* Force background on all major containers */
        html, body, main, .container, article {
            background-color: var(--bg-color) !important;
        }
        
        /* Obsidian-style heading hierarchy */
        h1, h2, h3, h4, h5, h6 {
            color: var(--heading-color) !important;
            margin-top: 2rem !important;
            margin-bottom: 1rem !important;
            font-weight: 600;
            letter-spacing: -0.025em;
        }
        
        h1 {
            font-size: 2.25rem;
            margin-top: 0 !important;
        }
        
        h2 {
            font-size: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        h3 {
            font-size: 1.375rem;
        }
        
        /* Better paragraph spacing */
        p {
            margin-bottom: 1.25rem;
            color: var(--text-color);
        }
        
        /* Obsidian-style links */
        a {
            color: var(--link-color) !important;
            text-decoration: none;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        /* Navigation links should be dark */
        nav a {
            color: var(--text-color) !important;
        }
        
        /* Code block styling */
        pre {
            background: var(--code-bg) !important;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        
        /* Inline code */
        code {
            background: var(--code-bg) !important;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.875em;
            color: var(--text-color);
        }
        
        /* Obsidian-style blockquotes */
        blockquote {
            background: var(--blockquote-bg);
            border-left: 4px solid var(--link-color);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0 8px 8px 0;
            font-style: normal;
        }
        
        /* Note callouts - when blockquote starts with **Note:** */
        blockquote p:first-child:has(strong:first-child) {
            font-style: normal;
        }
        
        blockquote strong:first-child {
            color: var(--link-color);
            font-weight: 600;
        }
        
        /* Special styling for different note types */
        blockquote:has(strong:first-child:contains("Note:")) {
            border-left-color: var(--link-color);
            background: rgba(99, 102, 241, 0.1);
        }
        
        blockquote:has(strong:first-child:contains("Warning:")) {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        
        blockquote:has(strong:first-child:contains("Tip:")) {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        /* Better table styling */
        table {
            background: var(--table-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
            overflow: hidden;
        }
        
        th {
            background: var(--code-bg);
            font-weight: 600;
            color: var(--text-color);
            padding: 0.75rem;
        }
        
        td {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
        }
        
        /* Better list styling */
        ul, ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }
        
        li {
            margin-bottom: 0.5rem;
        }
        
        /* Images with subtle styling */
        img {
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin: 1.5rem auto;
            display: block;
            max-height: 500px;
            width: auto;
            max-width: 100%;
        }
        
        /* Horizontal rule */
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }
        
        /* MathJax styling */
        .MathJax {
            font-size: 1.1em !important;
        }
        
        /* Display math (block equations) */
        .MathJax_Display {
            margin: 1.5rem 0 !important;
        }
        
        /* Center display math */
        mjx-container[display="true"] {
            display: block !important;
            text-align: center !important;
            margin: 1.5rem 0 !important;
        }
        
        /* Footnote styling */
        .footnote {
            font-size: 0.875rem;
            color: var(--muted-text);
            margin: 0.5rem 0;
            padding-left: 1rem;
            border-left: 2px solid var(--border-color);
        }
        
        .footnote p {
            margin: 0.5rem 0;
        }
        
        a.footnote-ref {
            color: var(--link-color);
            text-decoration: none;
            font-size: 0.8em;
            vertical-align: super;
            padding: 0 0.2em;
        }
        
        a.footnote-ref:hover {
            text-decoration: underline;
        }
        
        .footnote-backref {
            margin-left: 0.5rem;
            font-size: 0.8em;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--background-color);
            border-bottom: var(--border-width) solid var(--muted-border-color);
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .nav-left .nav-name {
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        .nav-right {
            display: flex;
            gap: 2rem;
        }
        
        .nav-right a {
            text-decoration: none;
            font-weight: 500;
        }
        
        main {
            margin-top: 80px;
        }
        
        .about-content {
            display: flex;
            align-items: center;
            gap: 3rem;
            margin-bottom: 2rem;
        }
        
        .about-left {
            flex-shrink: 0;
        }
        
        .profile-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .about-right {
            flex: 1;
        }
        
        .bio-text {
            text-align: left;
            line-height: 1.6;
        }
        
        .bio-text p {
            margin-bottom: 1rem;
        }
        
        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .about-content {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }
            
            .bio-text {
                text-align: center;
            }
        }
        
        .publication {
            margin-bottom: 1.5rem;
        }
        
        .publication-title {
            font-weight: bold;
        }
        
        .publication-venue {
            font-style: italic;
        }
        
        .project {
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .project-link {
            font-weight: bold;
            color: var(--link-color) !important;
            text-decoration: none;
        }
        
        .project-link:hover {
            text-decoration: underline;
        }
        
        .blog-post-item {
            margin-bottom: 1rem;
        }
        
        .blog-post-date {
            color: var(--muted-text);
            font-size: 0.9em;
            font-weight: 400;
        }
        
        section {
            margin-bottom: 0rem;
            padding: 1rem 0;
            scroll-margin-top: 100px; /* Ensure section headers appear below nav */
        }
        
        footer {
            text-align: center;
            margin-top: 0rem;
            border-top: var(--border-width) solid var(--muted-border-color);
        }
        
        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .footer-links {
            display: flex;
            gap: 2rem;
        }
        
        .footer-link {
            color: var(--text-color) !important;
            text-decoration: none;
            display: inline-block;
            transition: color 0.3s ease;
        }
        
        .footer-link:hover {
            color: var(--link-color) !important;
        }
        
        .footer-link svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
        }
        
        .footer-text {
            margin: 0;
            color: var(--muted-color);
            font-size: 0.9rem;
        }
        
        /* Table of Contents Styling */
        .post-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            max-width: 100%;
        }
        
        .toc-sidebar {
            width: 250px;
            min-width: 250px;
            max-width: 250px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-self: flex-start;
        }
        
        .toc h3 {
            margin-top: 0;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            color: var(--heading-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
        }
        
        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .toc-list li {
            margin-bottom: 0.1rem;
        }
        
        .toc-link {
            display: block;
            padding: 0.2rem 0;
            color: var(--muted-text);
            text-decoration: none;
            font-size: 0.8rem;
            line-height: 1.3;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .toc-link:hover {
            color: var(--link-color);
            background: rgba(99, 102, 241, 0.1);
            padding-left: 0.3rem;
        }
        
        .toc-link.active {
            color: var(--link-color);
            background: rgba(99, 102, 241, 0.1);
            padding-left: 0.3rem;
            font-weight: 600;
        }
        
        /* Different indentation levels for headings */
        .toc-level-1 .toc-link {
            padding-left: 0;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .toc-level-2 .toc-link {
            padding-left: 0.8rem;
        }
        
        .toc-level-3 .toc-link {
            padding-left: 1.6rem;
        }
        
        .toc-level-4 .toc-link {
            padding-left: 2.4rem;
        }
        
        .toc-level-5 .toc-link {
            padding-left: 3.2rem;
        }
        
        .toc-level-6 .toc-link {
            padding-left: 4rem;
        }
        
        /* Collapsible TOC - hide sub-headings by default */
        .toc-list li:not(.toc-level-1):not(.toc-level-2) {
            display: none;
        }
        
        /* Show sub-headings for active sections */
        .toc-list li.toc-level-1.has-active-child ~ li:not(.toc-level-1):not(.toc-level-2),
        .toc-list li.toc-level-2.has-active-child ~ li:not(.toc-level-1):not(.toc-level-2) {
            display: block;
        }
        
        .post-main {
            flex: 1;
            min-width: 0;
            max-width: calc(100% - 250px - 2rem);
            overflow-wrap: break-word;
        }
        
        /* Responsive design - hide TOC on smaller screens */
        @media (max-width: 1024px) {
            .post-layout {
                flex-direction: column;
            }
            
            .toc-sidebar {
                position: static;
                width: 100%;
                max-height: none;
                order: -1;
            }
        }
        
        @media (max-width: 768px) {
            .toc-sidebar {
                display: none;
            }
        }
    </style>
    
    <!-- Table of Contents scroll tracking script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Only run TOC script on pages that have TOC
            const tocLinks = document.querySelectorAll('.toc-link');
            if (tocLinks.length === 0) return;
            
            const headings = [];
            const tocLinkMap = new Map();
            
            // Build map of headings and their corresponding TOC links
            tocLinks.forEach(link => {
                const targetId = link.getAttribute('data-target');
                const heading = document.getElementById(targetId);
                if (heading) {
                    headings.push({
                        element: heading,
                        link: link,
                        id: targetId
                    });
                    tocLinkMap.set(targetId, link);
                }
            });
            
            // Sort headings by their position in the document
            headings.sort((a, b) => {
                return a.element.offsetTop - b.element.offsetTop;
            });
            
            function updateActiveLink() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                
                let activeHeading = null;
                
                // Find the current active heading
                for (let i = 0; i < headings.length; i++) {
                    const heading = headings[i];
                    const headingTop = heading.element.offsetTop - 100; // Account for fixed nav
                    
                    // If we're at the bottom of the page, highlight the last heading
                    if (scrollY + windowHeight >= documentHeight - 50) {
                        activeHeading = headings[headings.length - 1];
                        break;
                    }
                    
                    // If this heading is visible or we've scrolled past it
                    if (scrollY >= headingTop) {
                        activeHeading = heading;
                    } else {
                        break;
                    }
                }
                
                // Update active states and show/hide sub-headings
                tocLinks.forEach(link => link.classList.remove('active'));
                document.querySelectorAll('.toc-list li').forEach(li => {
                    li.classList.remove('has-active-child');
                });
                
                if (activeHeading) {
                    activeHeading.link.classList.add('active');
                    
                    // Show sub-headings for active section
                    const activeLevel = parseInt(activeHeading.link.closest('li').className.match(/toc-level-(\d+)/)[1]);
                    const activeParent = activeHeading.link.closest('li');
                    
                    // Mark parent as having active child to show sub-headings
                    if (activeLevel <= 2) {
                        activeParent.classList.add('has-active-child');
                    }
                    
                    // Show sub-headings for this section
                    let currentLi = activeParent.nextElementSibling;
                    while (currentLi && currentLi.classList.contains('toc-level-' + (activeLevel + 1))) {
                        currentLi.style.display = 'block';
                        currentLi = currentLi.nextElementSibling;
                    }
                }
            }
            
            // Add smooth scrolling to TOC links
            tocLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const target = document.getElementById(targetId);
                    if (target) {
                        const offsetTop = target.offsetTop - 100; // Account for fixed nav
                        window.scrollTo({
                            top: offsetTop,
                            behavior: 'smooth'
                        });
                    }
                });
            });
            
            // Update active link on scroll
            window.addEventListener('scroll', updateActiveLink);
            
            // Initial update
            updateActiveLink();
        });
    </script>
</head>
<body>
    {{ content }}
</body>
</html>
