<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    
    <!-- MathJax for LaTeX math rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* Obsidian-inspired light theme */
        :root {
            --bg-color: #fafafa; /* Clean light background */
            --text-color: #2e3338; /* Slightly softer black */
            --heading-color: #1a202c; /* Dark gray/black for headings */
            --link-color: #6366f1; /* Indigo links */
            --muted-text: #64748b; /* Muted text color */
            --border-color: #e2e8f0; /* Light border */
            --code-bg: #f1f5f9; /* Light code background */
            --blockquote-bg: #f8fafc; /* Light blockquote background */
            --table-bg: rgba(248, 250, 252, 0.5); /* Subtle table background */
            
            /* Override Pico.css variables */
            --background-color: var(--bg-color) !important;
            --color: var(--text-color) !important;
            --spacing: 0.25rem;
        }
        
        * {
            background-color: inherit !important;
        }
        
        html, body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            line-height: 1.65;
        }
        
        /* Force background on all major containers */
        html, body, main, .container, article {
            background-color: var(--bg-color) !important;
        }
        
        /* Obsidian-style heading hierarchy */
        h1, h2, h3, h4, h5, h6 {
            color: var(--heading-color) !important;
            margin-top: 2rem !important;
            margin-bottom: 1rem !important;
            font-weight: 600;
            letter-spacing: -0.025em;
        }
        
        h1 {
            font-size: 2.25rem;
            margin-top: 0 !important;
        }
        
        h2 {
            font-size: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        h3 {
            font-size: 1.375rem;
        }
        
        /* Better paragraph spacing */
        p {
            margin-bottom: 1.25rem;
            color: var(--text-color);
        }
        
        /* Obsidian-style links */
        a {
            color: var(--link-color) !important;
            text-decoration: none;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        /* Navigation links should be dark */
        nav a {
            color: var(--text-color) !important;
        }
        
        /* Obsidian-style code blocks */
        pre {
            background: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        
        /* Inline code */
        code {
            background: var(--code-bg) !important;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.875em;
            color: var(--text-color);
        }
        
        /* Obsidian-style blockquotes */
        blockquote {
            background: var(--blockquote-bg);
            border-left: 4px solid var(--link-color);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }
        
        /* Better table styling */
        table {
            background: var(--table-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
            overflow: hidden;
        }
        
        th {
            background: var(--code-bg);
            font-weight: 600;
            color: var(--text-color);
            padding: 0.75rem;
        }
        
        td {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
        }
        
        /* Better list styling */
        ul, ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }
        
        li {
            margin-bottom: 0.5rem;
        }
        
        /* Images with subtle styling */
        img {
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin: 1.5rem 0;
        }
        
        /* Horizontal rule */
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }
        
        /* MathJax styling */
        .MathJax {
            font-size: 1.1em !important;
        }
        
        /* Display math (block equations) */
        .MathJax_Display {
            margin: 1.5rem 0 !important;
        }
        
        /* Center display math */
        mjx-container[display="true"] {
            display: block !important;
            text-align: center !important;
            margin: 1.5rem 0 !important;
        }
        
        /* Footnote styling */
        .footnote {
            font-size: 0.875rem;
            color: var(--muted-text);
            margin: 0.5rem 0;
            padding-left: 1rem;
            border-left: 2px solid var(--border-color);
        }
        
        .footnote p {
            margin: 0.5rem 0;
        }
        
        a.footnote-ref {
            color: var(--link-color);
            text-decoration: none;
            font-size: 0.8em;
            vertical-align: super;
            padding: 0 0.2em;
        }
        
        a.footnote-ref:hover {
            text-decoration: underline;
        }
        
        .footnote-backref {
            margin-left: 0.5rem;
            font-size: 0.8em;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--background-color);
            border-bottom: var(--border-width) solid var(--muted-border-color);
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .nav-left .nav-name {
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        .nav-right {
            display: flex;
            gap: 2rem;
        }
        
        .nav-right a {
            text-decoration: none;
            font-weight: 500;
        }
        
        main {
            margin-top: 80px;
        }
        
        .about-content {
            display: flex;
            align-items: center;
            gap: 3rem;
            margin-bottom: 2rem;
        }
        
        .about-left {
            flex-shrink: 0;
        }
        
        .profile-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .about-right {
            flex: 1;
        }
        
        .bio-text {
            text-align: left;
            line-height: 1.6;
        }
        
        .bio-text p {
            margin-bottom: 1rem;
        }
        
        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .about-content {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }
            
            .bio-text {
                text-align: center;
            }
        }
        
        .publication {
            margin-bottom: 1.5rem;
        }
        
        .publication-title {
            font-weight: bold;
        }
        
        .publication-venue {
            font-style: italic;
        }
        
        .project {
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .project-link {
            font-weight: bold;
            color: var(--link-color) !important;
            text-decoration: none;
        }
        
        .project-link:hover {
            text-decoration: underline;
        }
        
        .blog-post-item {
            margin-bottom: 1rem;
        }
        
        .blog-post-date {
            color: var(--muted-text);
            font-size: 0.9em;
            font-weight: 400;
        }
        
        section {
            margin-bottom: 0rem;
            padding: 1rem 0;
            scroll-margin-top: 100px; /* Ensure section headers appear below nav */
        }
        
        footer {
            text-align: center;
            margin-top: 0rem;
            border-top: var(--border-width) solid var(--muted-border-color);
        }
        
        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .footer-links {
            display: flex;
            gap: 2rem;
        }
        
        .footer-link {
            color: var(--text-color) !important;
            text-decoration: none;
            display: inline-block;
            transition: color 0.3s ease;
        }
        
        .footer-link:hover {
            color: var(--link-color) !important;
        }
        
        .footer-link svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
        }
        
        .footer-text {
            margin: 0;
            color: var(--muted-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
